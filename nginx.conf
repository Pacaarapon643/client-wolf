server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---------------------------------------------------------------------------
    # Gzip compression
    # ---------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject;

    # ---------------------------------------------------------------------------
    # Security headers
    # ---------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN"         always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header X-XSS-Protection "1; mode=block"     always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ---------------------------------------------------------------------------
    # Reverse proxy → Go backend  (/api/*)
    # ---------------------------------------------------------------------------
    location /api/ {
        # DNS resolver — จำเป็นเมื่อใช้ variable ใน proxy_pass
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        # ใช้ variable เพื่อให้ Nginx resolve DNS ตอน runtime (ไม่ใช่ตอน start)
        set $backend "https://wolf-backend-47789994243.asia-southeast1.run.app";

        # ⚠️ เมื่อ proxy_pass ใช้ variable → Nginx ไม่ rewrite URI ให้อัตโนมัติ
        # ต้อง rewrite เอง: /api/auths/login → /api/v1/auths/login
        rewrite ^/api/(.*)$ /api/v1/$1 break;
        proxy_pass $backend;

        proxy_http_version 1.1;

        # HTTPS SNI — จำเป็นสำหรับ Cloud Run (ให้ TLS handshake ส่งชื่อ server ถูก)
        proxy_ssl_server_name on;

        # WebSocket support
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # ⚠️ ต้องส่ง Host ของ BACKEND ไม่ใช่ $host (frontend)
        # ถ้าส่ง $host (frontend hostname) → Cloud Run จะ route กลับมา frontend → loop!
        proxy_set_header Host              wolf-backend-47789994243.asia-southeast1.run.app;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  900s;
        proxy_send_timeout  900s;
        proxy_connect_timeout 60s;
    }

    # ---------------------------------------------------------------------------
    # Static assets — long-lived cache (Vite adds content hashes to filenames)
    # ---------------------------------------------------------------------------
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---------------------------------------------------------------------------
    # SPA fallback — send everything else to index.html
    # ---------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;

        # Prevent caching the HTML shell so the browser always fetches latest
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ---------------------------------------------------------------------------
    # Health check endpoint (useful for Docker/K8s)
    # ---------------------------------------------------------------------------
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
